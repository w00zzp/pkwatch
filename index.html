<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>PK Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;
  --surface:#0f0f1a;
  --surface2:#161625;
  --border:#1e1e30;
  --border-hover:#2e2e48;
  --accent:#7c6fe0;
  --accent-dim:#3d3870;
  --accent-glow:rgba(124,111,224,.18);
  --text:#e8e8f0;
  --muted:#6b6b88;
  --muted2:#9090a8;
  --green:#34d399;
  --green-bg:#0d2a1f;
  --red:#f87171;
  --radius:14px;
  --radius-sm:10px;
  --font:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}

/* layout */
.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:32px 16px 48px}

/* wordmark */
.wordmark{display:flex;align-items:center;gap:10px;margin-bottom:40px;user-select:none}
.wordmark svg{color:var(--accent)}
.wordmark-text{font-size:20px;font-weight:600;letter-spacing:-.3px;color:var(--text)}
.wordmark-text span{color:var(--accent)}

/* card */
.card{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;display:flex;flex-direction:column;gap:0}

/* section divider inside card */
.divider{border:none;border-top:1px solid var(--border);margin:22px 0}

/* field */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field:last-of-type{margin-bottom:0}
.label{font-size:11px;font-weight:500;color:var(--muted2);letter-spacing:.04em}
.input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--font);width:100%;transition:border-color .15s,box-shadow .15s;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.input::placeholder{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-sm);padding:12px 18px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s,background .15s;outline:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;width:100%;padding:14px}
.btn-primary:hover{opacity:.88}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-hover)}
.btn-green{background:var(--green);color:#052016;font-weight:600}
.btn-green:hover{opacity:.88}
.btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border);padding:9px 14px;font-size:13px}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover)}

/* join row */
.join-row{display:flex;gap:8px}
.join-row .input{flex:1;text-transform:uppercase;letter-spacing:.1em;font-weight:500}

/* or separator */
.or-sep{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--muted);font-size:12px}
.or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--border)}

/* hint */
.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px}

/* msg */
.msg{font-size:13px;color:var(--muted2);min-height:18px;margin-top:12px;transition:color .2s}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}

/* ---- ROOM ---- */
#room{display:none;width:100%;max-width:900px;flex-direction:column;gap:0}
#room.on{display:flex}

.room-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.room-title{display:flex;align-items:center;gap:10px}
.room-wordmark{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--text)}
.room-wordmark svg{color:var(--accent)}
.badge{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.room-actions{display:flex;gap:8px;align-items:center}

/* stage */
.stage{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;width:100%}
video{width:100%;height:100%;display:block;background:#000}
.stage-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .3s}
.stage-overlay-text{color:rgba(255,255,255,.7);font-size:14px;font-weight:400;letter-spacing:.01em}

/* guest lock overlay */
.guest-lock{position:absolute;inset:0;z-index:10;cursor:default}

/* status bar */
.status-bar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.on{background:var(--green)}
.status-text{font-size:13px;color:var(--muted2);flex:1}
.status-pill{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--muted2)}

/* layout: stage + chat side by side on desktop */
.room-body{display:flex;gap:16px;align-items:flex-start;margin-top:16px}
.room-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.room-right{width:280px;flex-shrink:0}

/* chat */
.chat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:360px}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted2);letter-spacing:.03em}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-track{background:transparent}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.m{font-size:13px;line-height:1.4;max-width:88%}
.m-name{font-size:10px;font-weight:500;color:var(--muted2);margin-bottom:3px;letter-spacing:.02em}
.m-bubble{display:inline-block;background:var(--surface2);padding:7px 11px;border-radius:10px;color:var(--text)}
.m.me{align-self:flex-end;text-align:right}
.m.me .m-name{color:var(--accent)}
.m.me .m-bubble{background:var(--accent-dim);color:var(--text)}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.cf .input{padding:9px 12px;font-size:14px}
.cf .btn{padding:9px 14px;font-size:13px}

/* mobile: stack */
@media(max-width:720px){
  .shell{padding:20px 12px 40px}
  .wordmark{margin-bottom:28px}
  .card{padding:22px 18px}
  .room-body{flex-direction:column}
  .room-right{width:100%}
  .chat{height:260px}
  .room-header{flex-direction:column;align-items:flex-start}
  .room-actions{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="shell">

  <!-- wordmark -->
  <div class="wordmark" id="mainWordmark">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20.409 9.353C22.53 10.507 22.53 13.493 20.409 14.647L7.597 21.614C5.534 22.736 3 21.276 3 18.967L3 5.033C3 2.724 5.534 1.264 7.597 2.385L20.409 9.353Z"/></svg>
    <div class="wordmark-text">PK<span>Watch</span></div>
  </div>

  <!-- SETUP -->
  <div class="card" id="setup">
    <div class="field">
      <div class="label">Link do filme</div>
      <input class="input" id="urlInput" placeholder="https://... (.mp4 ou página do filme)" value="https://awnagk.gviudclrb.com/vod/71796FA488A24F5FB8BEC47F5F7E2D18_media.mp4">
    </div>
    <div class="field">
      <div class="label">Seu nome</div>
      <input class="input" id="nameInput" maxlength="16" placeholder="Como você quer aparecer">
    </div>
    <button class="btn btn-primary" id="createBtn" style="margin-top:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Criar sala
    </button>

    <div class="or-sep">ou entre em uma sala</div>

    <div class="join-row">
      <input class="input" id="codeInput" maxlength="4" placeholder="CÓDIGO">
      <button class="btn btn-green" id="joinBtn">Entrar</button>
    </div>

    <div class="msg" id="setupMsg"></div>
    <div class="hint">Cole o link .mp4 direto. Se colar a página do filme, o site tenta achar o .mp4 sozinho.</div>
  </div>

  <!-- ROOM -->
  <div id="room">
    <div class="room-header">
      <div class="room-title">
        <div class="room-wordmark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20.409 9.353C22.53 10.507 22.53 13.493 20.409 14.647L7.597 21.614C5.534 22.736 3 21.276 3 18.967L3 5.033C3 2.724 5.534 1.264 7.597 2.385L20.409 9.353Z"/></svg>
          PKWatch
        </div>
        <div class="badge" id="badge">SALA –</div>
      </div>
      <div class="room-actions">
        <button class="btn btn-ghost" id="copyBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar link
        </button>
        <button class="btn btn-ghost" id="leaveBtn">Sair</button>
      </div>
    </div>

    <div class="room-body">
      <div class="room-left">
        <div class="stage" id="stage">
          <video id="video" playsinline webkit-playsinline preload="metadata"></video>
          <!-- guest lock: blocks all clicks on video -->
          <div class="guest-lock" id="guestLock" style="display:none"></div>
          <div class="stage-overlay" id="stageOverlay">
            <div class="stage-overlay-text" id="stageOverlayText">Aguardando o host iniciar…</div>
          </div>
        </div>
        <div class="status-bar">
          <div class="dot" id="dot"></div>
          <div class="status-text" id="status">Conectando…</div>
          <div class="status-pill" id="countPill">1 na sala</div>
        </div>
        <!-- host controls only -->
        <div id="hostControls" style="display:none;margin-top:4px">
          <video id="videoHost" style="display:none"></video>
        </div>
      </div>

      <div class="room-right">
        <div class="chat">
          <div class="chat-header">Chat</div>
          <div class="msgs" id="msgs"></div>
          <div class="cf">
            <input class="input" id="chatInput" maxlength="160" placeholder="Mensagem…">
            <button class="btn btn-secondary" id="sendBtn">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div><!-- /shell -->

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };

// ── config ──────────────────────────────────────────────
var BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt'
];
var HOST_BROADCAST_MS  = 800;   // how often host pushes state
var DRIFT_THRESHOLD    = 1.0;   // seconds before forced resync
var PING_MS            = 5000;
var PEER_TIMEOUT_MS    = 18000;

// ── state ────────────────────────────────────────────────
var myId     = Math.random().toString(36).slice(2,8);
var myName   = 'Convidado';
var isHost   = false;
var code     = null;
var topic    = null;
var movieUrl = '';
var client   = null;

var peers    = {};          // id → lastSeen timestamp
var suppress = false;       // block echoing our own seeks
var lastHostState = null;   // last state msg from host

var hostBcastTimer = null;
var pingTimer      = null;

// ── elements ─────────────────────────────────────────────
var video     = $('video');
var overlay   = $('stageOverlay');
var overlayTx = $('stageOverlayText');
var guestLock = $('guestLock');

// ── broker ───────────────────────────────────────────────
function connect(i){
  i = i || 0;
  return new Promise(function(res, rej){
    var c, done = false;
    try{ c = mqtt.connect(BROKERS[i], {
      clientId: 'pkw_'+myId+Date.now(),
      clean: true, reconnectPeriod: 0, connectTimeout: 8000
    }); }catch(e){ return rej(e); }
    var to = setTimeout(function(){
      if(!done){ done=true; try{c.end(true)}catch(e){} rej(new Error('timeout')); }
    }, 9000);
    c.on('connect', function(){ if(done)return; done=true; clearTimeout(to); res(c); });
    c.on('error', function(){});
  }).catch(function(){
    if(i+1 < BROKERS.length) return connect(i+1);
    throw new Error('sem broker');
  });
}

function pub(o, retain){
  if(!client||!topic) return;
  try{ client.publish(topic, JSON.stringify(o), {qos:0, retain:!!retain}); }catch(e){}
}

// ── host broadcasts authoritative state ──────────────────
function hostBroadcast(){
  if(!isHost) return;
  pub({
    t:'s', by:myId,
    playing: !video.paused,
    time: video.currentTime || 0,
    ts: Date.now()
  }, true);
}

// ── guest applies state from host ────────────────────────
function applyHostState(m){
  if(m.by === myId) return;          // ignore our own (shouldn't happen for guest)
  lastHostState = m;
  if(video.readyState < 1) return;

  var latency = m.playing ? Math.min((Date.now()-m.ts)/1000, 30) : 0;
  var target  = (m.time||0) + latency;
  var drift   = Math.abs((video.currentTime||0) - target);

  suppress = true;
  if(drift > DRIFT_THRESHOLD){
    try{ video.currentTime = target; }catch(e){}
  }
  if(m.playing && video.paused)  video.play().catch(function(){});
  if(!m.playing && !video.paused) video.pause();
  clearTimeout(applyHostState._t);
  applyHostState._t = setTimeout(function(){ suppress=false; }, 600);

  // hide overlay once playing
  if(m.playing){ overlay.style.opacity='0'; }
  else          { overlay.style.opacity='0'; } // host paused = still in room, just paused
}

// ── incoming messages ────────────────────────────────────
function onMsg(payload){
  var m;
  try{ m = JSON.parse(payload.toString()); }catch(e){ return; }

  if(m.by && m.by !== myId) peers[m.by] = Date.now();

  if(m.t === 's'){
    if(!isHost) applyHostState(m);
  } else if(m.t === 'hello'){
    // new guest joined — host re-broadcasts current state immediately
    if(isHost){ hostBroadcast(); setTimeout(hostBroadcast, 500); }
  } else if(m.t === 'bye'){
    if(m.by) delete peers[m.by];
  } else if(m.t === 'chat' && m.by !== myId){
    addMsg(m.name||'?', m.text||'', false);
  }

  renderPeers();
}

// ── url resolver ─────────────────────────────────────────
function normUrl(u){
  u=(u||'').trim();
  if(!u) return '';
  if(u.indexOf('//')=== 0) u='https:'+u;
  if(u.indexOf('http://')===0) u='https://'+u.slice(7);
  if(u.indexOf('https://')!==0) u='https://'+u;
  return u;
}
async function resolveUrl(u){
  if(/\.mp4(\?|$)/i.test(u)) return u;
  var proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?'];
  for(var i=0;i<proxies.length;i++){
    try{
      var r=await fetch(proxies[i]+encodeURIComponent(u));
      if(!r.ok) continue;
      var t=await r.text();
      var match=t.match(/https?:\/\/[^"'\s\\]+\.mp4/);
      if(match) return match[0];
    }catch(e){}
  }
  return u;
}

// ── code gen ─────────────────────────────────────────────
function genCode(){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var c='';
  for(var i=0;i<4;i++) c+=a.charAt(Math.floor(Math.random()*a.length));
  return c;
}

// ── UI helpers ───────────────────────────────────────────
function setMsg(t, type){
  var el=$('setupMsg');
  el.textContent=t||'';
  el.className='msg'+(type?' '+type:'');
}
function setStatus(t){
  $('status').textContent=t||'';
}
function renderPeers(){
  var now=Date.now();
  for(var k in peers){ if(now-peers[k]>PEER_TIMEOUT_MS) delete peers[k]; }
  var n=Object.keys(peers).length+1;
  $('countPill').textContent=n+(n===1?' na sala':' na sala');
  $('dot').className='dot'+(client?' on':'');
}

function addMsg(name, text, me){
  var d=document.createElement('div');
  d.className='m'+(me?' me':'');
  var nameEl=document.createElement('div');
  nameEl.className='m-name';
  nameEl.textContent=name;
  var bubble=document.createElement('div');
  bubble.className='m-bubble';
  bubble.textContent=text;
  d.appendChild(nameEl);
  d.appendChild(bubble);
  var box=$('msgs');
  box.appendChild(d);
  while(box.children.length>100) box.removeChild(box.firstChild);
  box.scrollTop=box.scrollHeight;
}

// ── join room (shared between create & join) ─────────────
function finishJoin(host){
  topic   = 'pkwatch/'+code;
  isHost  = host;

  $('setup').style.display='none';
  $('mainWordmark').style.display='none';
  $('room').classList.add('on');
  $('badge').textContent='SALA '+code;

  video.src=movieUrl;
  video.load();

  // guest: block all controls
  if(!isHost){
    video.controls=false;
    guestLock.style.display='block';
    overlayTx.textContent='Aguardando o host iniciar…';
    overlay.style.opacity='1';
  } else {
    video.controls=true;
    overlay.style.opacity='1';
    overlayTx.textContent='Toque no play para começar';
  }

  if(client){
    client.on('message', function(t,p){ onMsg(p); });
    client.subscribe(topic, {qos:0});
  }

  // host: start broadcasting loop
  if(isHost){
    clearInterval(hostBcastTimer);
    hostBcastTimer=setInterval(hostBroadcast, HOST_BROADCAST_MS);
    // push URL into hash so share link works
    try{ history.replaceState(null,'','#s='+code+'&v='+encodeURIComponent(movieUrl)); }catch(e){}
  }

  // guest: announce presence
  if(!isHost && client){
    setTimeout(function(){ pub({t:'hello',by:myId}); }, 400);
  }

  // ping loop
  clearInterval(pingTimer);
  pingTimer=setInterval(function(){
    pub({t:'ping',by:myId});
    renderPeers();
  }, PING_MS);

  setStatus(isHost ? 'Você é o host' : 'Conectado como convidado');
  renderPeers();
}

// ── video events (host only broadcasts, guest ignores) ───
video.addEventListener('play',   function(){ if(isHost&&!suppress){ hostBroadcast(); overlay.style.opacity='0'; } });
video.addEventListener('pause',  function(){ if(isHost&&!suppress) hostBroadcast(); });
video.addEventListener('seeked', function(){ if(isHost&&!suppress) hostBroadcast(); });
video.addEventListener('canplay',function(){ if(isHost) overlay.style.opacity='0'; });
video.addEventListener('waiting',function(){ overlay.style.opacity='1'; overlayTx.textContent='Carregando…'; });
video.addEventListener('loadedmetadata',function(){
  if(!isHost && lastHostState) applyHostState(lastHostState);
});

// ── create ───────────────────────────────────────────────
$('createBtn').onclick=async function(){
  var raw=normUrl($('urlInput').value);
  if(!raw) return setMsg('Cole o link do filme.','err');
  myName=($('nameInput').value||'Host').slice(0,16);
  setMsg('Procurando o vídeo…');
  movieUrl=normUrl(await resolveUrl(raw));
  code=genCode();
  setMsg('Conectando…');
  try{ client=await connect(); }catch(e){ client=null; }
  finishJoin(true);
};

// ── join ─────────────────────────────────────────────────
$('joinBtn').onclick=async function(){
  var c=($('codeInput').value||'').trim().toUpperCase();
  if(c.length<3) return setMsg('Digite o código da sala.','err');
  var raw=normUrl($('urlInput').value);
  myName=($('nameInput').value||'Convidada').slice(0,16);
  setMsg('Procurando o vídeo…');
  movieUrl=raw?normUrl(await resolveUrl(raw)):movieUrl;
  code=c;
  setMsg('Entrando na sala…');
  try{ client=await connect(); }catch(e){ client=null; }
  finishJoin(false);
};

// ── copy link ────────────────────────────────────────────
$('copyBtn').onclick=function(){
  var link=location.origin+location.pathname+'#s='+code+'&v='+encodeURIComponent(movieUrl);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(
      function(){ setStatus('Link copiado!'); setTimeout(function(){ setStatus(isHost?'Você é o host':'Conectado como convidado'); },2000); },
      function(){ prompt('Copie o link:',link); }
    );
  } else { prompt('Copie o link:',link); }
};

// ── leave ────────────────────────────────────────────────
$('leaveBtn').onclick=function(){
  try{ pub({t:'bye',by:myId}); }catch(e){}
  clearInterval(hostBcastTimer);
  clearInterval(pingTimer);
  location.href=location.pathname;
};

// ── chat ─────────────────────────────────────────────────
$('sendBtn').onclick=function(){
  var v=$('chatInput').value.trim();
  if(!v) return;
  $('chatInput').value='';
  addMsg(myName,v,true);
  pub({t:'chat',by:myId,name:myName,text:v});
};
$('chatInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); $('sendBtn').click(); }
});

// ── cleanup on close ─────────────────────────────────────
window.addEventListener('pagehide',function(){ try{pub({t:'bye',by:myId})}catch(e){} });

// ── parse invite link ────────────────────────────────────
(function(){
  var h=location.hash.replace(/^#/,'');
  if(!h) return;
  var p=new URLSearchParams(h);
  if(p.get('v')) $('urlInput').value=decodeURIComponent(p.get('v'));
  if(p.get('s')){
    $('codeInput').value=p.get('s').toUpperCase();
    setMsg('Convite para a sala '+p.get('s').toUpperCase()+'. Seu nome e toque em Entrar.');
  }
})();

})();
</script>
